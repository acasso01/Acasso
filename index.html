<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anthony Casso | IT Support Portfolio</title>
  <meta name="description" content="Anthony Casso IT support portfolio featuring help desk experience, technical projects, support labs, and Techboysgvs consulting work." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{--bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--offset:#f1eee8;--border:#d6d2ca;--text:#28251d;--muted:#6e6a62;--faint:#918d84;--inverse:#f8f8f4;--primary:#0f6972;--primary-deep:#0d4f57;--highlight:#d4e5e2;--shadow:0 12px 36px rgba(22,20,18,.08);--shadow-sm:0 4px 16px rgba(22,20,18,.06);--r-sm:.65rem;--r-md:1rem;--r-lg:1.3rem;--r-xl:1.75rem;--font-body:'Inter',system-ui,sans-serif;--font-display:'Instrument Serif',Georgia,serif}
    [data-theme="dark"]{--bg:#141311;--surface:#1c1b19;--surface2:#23211f;--offset:#292724;--border:#393530;--text:#ece6dd;--muted:#b5aea1;--faint:#847d71;--inverse:#181715;--primary:#5eacb5;--primary-deep:#8bc8cf;--highlight:#21383b;--shadow:0 18px 48px rgba(0,0,0,.34);--shadow-sm:0 8px 24px rgba(0,0,0,.22)}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
    img{display:block;max-width:100%;height:auto}
    a{text-decoration:none;color:inherit}
    button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
    .container{width:min(1160px,calc(100% - 2rem));margin-inline:auto}
    .skip{position:absolute;left:-9999px;top:1rem}
    .skip:focus{left:1rem;background:var(--surface);padding:.8rem 1rem;border-radius:var(--r-sm);z-index:50}

    .header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--text) 10%,transparent)}
    .nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0}
    .brand{display:flex;align-items:center;gap:.85rem;font-weight:700}
    .logo{width:2.5rem;height:2.5rem;border-radius:.85rem;background:linear-gradient(135deg,var(--primary),#80bac2);display:grid;place-items:center;color:white;box-shadow:var(--shadow-sm)}
    .logo svg{width:1.25rem;height:1.25rem}
    .links{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
    .links a{font-size:.95rem;color:var(--muted)}
    .links a:hover{color:var(--text)}

    .toggle,.btn,.btn-alt{min-height:44px;padding:.82rem 1rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--text) 10%,transparent);transition:.18s ease}
    .btn{background:var(--primary);color:var(--inverse);font-weight:600;border-color:transparent}
    .btn:hover{background:var(--primary-deep)}
    .btn-alt,.toggle{background:var(--surface)}
    .btn-alt:hover,.toggle:hover{background:var(--offset)}

    .hero{padding:4.8rem 0 3.6rem}
    .hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:2rem;align-items:end}
    .eyebrow{display:inline-flex;align-items:center;gap:.55rem;padding:.48rem .84rem;border-radius:999px;background:var(--highlight);color:var(--primary);text-transform:uppercase;letter-spacing:.07em;font-size:.78rem;font-weight:700}
    .hero h1{font-family:var(--font-display);font-size:clamp(2.7rem,5vw,5rem);line-height:1.02;max-width:11ch;margin-top:1rem}
    .hero p{margin-top:1rem;max-width:63ch;color:var(--muted)}
    .actions{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.6rem}

    .panel{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid color-mix(in srgb,var(--text) 10%,transparent);border-radius:var(--r-xl);box-shadow:var(--shadow)}
    .hero-card{padding:1.35rem;display:grid;gap:1rem}
    .mini{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
    .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
    .stat{padding:1rem;border-radius:var(--r-lg);background:var(--offset);border:1px solid color-mix(in srgb,var(--text) 8%,transparent)}
    .stat strong{display:block;font-size:1.5rem;line-height:1.1}
    .stat span{display:block;margin-top:.35rem;color:var(--muted);font-size:.95rem}

    section{padding:3.5rem 0}
    .head{display:grid;gap:.8rem;margin-bottom:1.5rem}
    .head h2{font-size:clamp(1.8rem,3vw,2.5rem)}
    .head p{max-width:72ch;color:var(--muted)}

    .about{display:grid;grid-template-columns:1.1fr .9fr;gap:1.25rem}
    .cards3,.proof-grid,.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
    .card{background:var(--surface);border:1px solid color-mix(in srgb,var(--text) 10%,transparent);border-radius:var(--r-lg);padding:1.25rem;box-shadow:var(--shadow-sm)}
    .card h3{margin-bottom:.45rem;font-size:1.05rem}
    .card p,.card li{color:var(--muted);font-size:.96rem}
    .card ul{margin-top:.8rem;padding-left:1rem;display:grid;gap:.4rem}

    .timeline{display:grid;gap:1rem}
    .timeline-item{padding:1.05rem 1.2rem;border-left:2px solid var(--primary);background:var(--surface);border-radius:0 var(--r-lg) var(--r-lg) 0;border:1px solid color-mix(in srgb,var(--text) 8%,transparent);border-left-width:2px}
    .timeline-item small{display:block;color:var(--faint);margin-bottom:.35rem}
    .tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);font-weight:700;margin-bottom:.55rem;display:block}

    .project-card{display:grid;gap:.8rem;align-content:start}

    .resume{background:var(--offset);padding:1.4rem;border-radius:var(--r-lg);border:1px solid color-mix(in srgb,var(--text) 10%,transparent)}
    .contact{padding:1.5rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center}

    .footer{padding:2rem 0 3rem;color:var(--faint)}
    .muted{color:var(--muted)}
    .reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}
    .reveal.visible{opacity:1;transform:none}

    @media (max-width:960px){
      .hero-grid,.about,.contact,.project-grid,.cards3,.proof-grid{grid-template-columns:1fr}
      .nav{flex-direction:column;align-items:flex-start}
      .links{width:100%}
      .stat-grid{grid-template-columns:1fr 1fr}
    }
    @media (max-width:620px){
      .container{width:min(100% - 1rem,1160px)}
      .stat-grid{grid-template-columns:1fr}
      .actions{flex-direction:column}
      .btn,.btn-alt{display:inline-flex;align-items:center;justify-content:center;width:100%}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .reveal{opacity:1;transform:none;transition:none}
    }
  </style>
</head>
